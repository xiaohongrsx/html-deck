<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="示例柱状图">
  <rect width="760" height="460" fill="#ffffff"/>

  <!-- 网格线 -->
  <g stroke="#eef1f2" stroke-width="1">
    <line x1="110" y1="380" x2="726" y2="380"/>
    <line x1="110" y1="304" x2="726" y2="304"/>
    <line x1="110" y1="228" x2="726" y2="228"/>
    <line x1="110" y1="152" x2="726" y2="152"/>
    <line x1="110" y1="76"  x2="726" y2="76"/>
  </g>
  <line x1="110" y1="40" x2="110" y2="380" stroke="#dde3e6" stroke-width="1.5"/>

  <!-- 柱 -->
  <g>
    <rect x="142" y="250" width="78" height="130" fill="#e2e8ea"/>
    <rect x="254" y="205" width="78" height="175" fill="#d6dee1"/>
    <rect x="366" y="170" width="78" height="210" fill="#c9d3d7"/>
    <rect x="478" y="125" width="78" height="255" fill="#b9c6ca"/>
    <rect x="590" y="50"  width="78" height="330" fill="#b43c35"/>
  </g>

  <!-- 标签 -->
  <g fill="#687278" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">
    <text x="181" y="410">基线</text>
    <text x="293" y="410">+ A</text>
    <text x="405" y="410">+ B</text>
    <text x="517" y="410">+ C</text>
    <text x="629" y="410" fill="#b43c35" font-weight="600">本文</text>
  </g>
  <g fill="#9aa4a9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end">
    <text x="96" y="309">0.6</text>
    <text x="96" y="233">0.7</text>
    <text x="96" y="157">0.8</text>
    <text x="96" y="81">0.9</text>
  </g>
  <text x="110" y="24" fill="#9aa4a9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14">accuracy ↑</text>
</svg>
